name: バグ報告
description: 再現可能な不具合を報告します
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。カレンダー名、予定名、会議URLなどの個人情報は伏せてください。

  - type: textarea
    id: summary
    attributes:
      label: 不具合の概要
      description: 何が起きたかを簡潔に記載してください。
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOSバージョン
      placeholder: "例: macOS 15.6"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: InMyFaceのバージョンまたはcommit
      placeholder: "例: main / abc1234"

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 補足情報
      description: ログや画像を添付する場合は、予定内容やローカルパスなどを削除してください。

  - type: checkboxes
    id: privacy
    attributes:
      label: 公開前の確認
      options:
        - label: 報告内容に予定情報、認証情報、その他の個人情報が含まれていないことを確認しました。
          required: true
